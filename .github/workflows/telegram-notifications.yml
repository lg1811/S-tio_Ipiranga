 // Ler o arquivo GeoJSON
        const geojson = JSON.parse(fs.readFileSync('dados.geojson', 'utf8'));
        
        // Contar plantas por espécie
        const especies = {};
        let total = 0;
        
        geojson.features.forEach(f => {
          const p = f.properties;
          const nome = p.NOME_POPULAR || p.nome_popular || p.especie || 'Desconhecida';
          especies[nome] = (especies[nome] || 0) + 1;
          total++;
        });
