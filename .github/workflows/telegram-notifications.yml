name: Notificações Telegram - Ações Diárias

on:
  push:
    branches:
      - main
    paths:
      - 'dados.geojson'
  schedule:
    # 06:00 BR = 09:00 UTC
    - cron: '0 9 * * *'
    # 12:00 BR = 15:00 UTC
    - cron: '0 15 * * *'
    # 15:00 BR = 18:00 UTC
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  notify-telegram:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Processar ações necessárias
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Instalar jq para processar JSON
          sudo apt-get update
          sudo apt-get install -y jq
          
          # Data atual
          HOJE=$(date +%Y-%m-%d)
          DATA_EXIBICAO=$(date +%d/%m/%Y)
          HORA_EXIBICAO=$(date +%H:%M)
          
          # Intervalos por espécie (dias)
          declare -A REGA_INT=( ["Mangabeira"]=7 ["Cajueiro"]=10 ["Coqueiro"]=5 ["Cacau"]=3 ["default"]=7 )
          declare -A PODA_INT=( ["Mangabeira"]=180 ["Cajueiro"]=365 ["Coqueiro"]=730 ["Cacau"]=180 ["default"]=180 )
          declare -A COLH_INT=( ["Mangabeira"]=90 ["Cajueiro"]=60 ["Coqueiro"]=30 ["Cacau"]=120 ["default"]=90 )
          
          # Função para calcular dias
          dias_desde() {
            if [ -z "$1" ] || [ "$1" = "null" ]; then
              echo "999"
            else
              echo $(( ( $(date -d "$HOJE" +%s) - $(date -d "$1" +%s) ) / 86400 ))
            fi
          }
          
          # Função para obter intervalo
          get_intervalo() {
            local especie=$1
            local tipo=$2
            local valor=""
            
            case "$tipo" in
              "rega")
                case "$especie" in
                  *"Mangabeira"*) valor=7 ;;
                  *"Caju"*) valor=10 ;;
                  *"Coq"*) valor=5 ;;
                  *"Cacau"*) valor=3 ;;
                  *) valor=7 ;;
                esac
                ;;
              "poda")
                case "$especie" in
                  *"Mangabeira"*) valor=180 ;;
                  *"Caju"*) valor=365 ;;
                  *"Coq"*) valor=730 ;;
                  *"Cacau"*) valor=180 ;;
                  *) valor=180 ;;
                esac
                ;;
              "colheita")
                case "$especie" in
                  *"Mangabeira"*) valor=90 ;;
                  *"Caju"*) valor=60 ;;
                  *"Coq"*) valor=30 ;;
                  *"Cacau"*) valor=120 ;;
                  *) valor=90 ;;
                esac
                ;;
            esac
            
            echo "$valor"
          }
          
          # Arrays de ações
          REGA_URG=""
          REGA_NORM=""
          PODA=""
          COLHEITA=""
          
          # Processar cada planta
          jq -c '.features[]' dados.geojson | while read -r feature; do
            ID=$(echo "$feature" | jq -r '.properties.ID // .properties.fid // "S/N"')
            NOME=$(echo "$feature" | jq -r '.properties.NOME_POPULAR // .properties.nome_popular // "Planta"')
            ULT_REGA=$(echo "$feature" | jq -r '.properties.ULTIMA_REGA // .properties.ultima_rega // "null"')
            ULT_PODA=$(echo "$feature" | jq -r '.properties.ULTIMA_PODA // .properties.ultima_poda // "null"')
            ULT_COLH=$(echo "$feature" | jq -r '.properties.ULTIMA_COLHEITA // .properties.ultima_colheita // "null"')
            
            # Verificar rega
            INT_R=$(get_intervalo "$NOME" "rega")
            DIAS_R=$(dias_desde "$ULT_REGA")
            
            if [ "$DIAS_R" -ge $((INT_R + 2)) ]; then
              echo "REGA_URG:$NOME #$ID - Atrasada $DIAS_R dias" >> /tmp/acoes.txt
            elif [ "$DIAS_R" -ge "$INT_R" ]; then
              if [ "$ULT_REGA" = "null" ]; then
                echo "REGA_NORM:$NOME #$ID - Nunca foi regada" >> /tmp/acoes.txt
              else
                echo "REGA_NORM:$NOME #$ID - Há $DIAS_R dias sem regar" >> /tmp/acoes.txt
              fi
            fi
            
            # Verificar poda
            INT_P=$(get_intervalo "$NOME" "poda")
            DIAS_P=$(dias_desde "$ULT_PODA")
            
            if [ "$DIAS_P" -ge "$INT_P" ]; then
              if [ "$ULT_PODA" = "null" ]; then
                echo "PODA:$NOME #$ID - Nunca foi podada" >> /tmp/acoes.txt
              else
                echo "PODA:$NOME #$ID - Há $DIAS_P dias sem poda" >> /tmp/acoes.txt
              fi
            fi
            
            # Verificar colheita
            INT_C=$(get_intervalo "$NOME" "colheita")
            DIAS_C=$(dias_desde "$ULT_COLH")
            
            if [ "$DIAS_C" -ge "$INT_C" ]; then
              if [ "$ULT_COLH" = "null" ]; then
                echo "COLHEITA:$NOME #$ID - Verificar frutos" >> /tmp/acoes.txt
              else
                echo "COLHEITA:$NOME #$ID - Há $DIAS_C dias sem colheita" >> /tmp/acoes.txt
              fi
            fi
          done
          
          # Montar mensagem
          TOTAL=$(jq '.features | length' dados.geojson)
          
          # Saudação por horário
          HORA_NUM=$(date +%H)
          if [ "$HORA_NUM" -lt 12 ]; then
            SAUDACAO="Bom dia"
          elif [ "$HORA_NUM" -lt 18 ]; then
            SAUDACAO="Boa tarde"
          else
            SAUDACAO="Boa noite"
          fi
          
          MESSAGE="${SAUDACAO}!%0A"
          MESSAGE="${MESSAGE}Data: ${DATA_EXIBICAO} - ${HORA_EXIBICAO}%0A%0A"
          
          # Contar ações
          if [ -f /tmp/acoes.txt ]; then
            TOTAL_ACOES=$(wc -l < /tmp/acoes.txt)
          else
            TOTAL_ACOES=0
          fi
          
          if [ "$TOTAL_ACOES" -eq 0 ]; then
            MESSAGE="${MESSAGE}Tudo em dia!%0A%0A"
            MESSAGE="${MESSAGE}Nenhuma ação necessária.%0A"
            MESSAGE="${MESSAGE}Todas as plantas estão em dia!"
          else
            MESSAGE="${MESSAGE}Ações Necessárias: ${TOTAL_ACOES}%0A%0A"
            
            # Adicionar ações urgentes
            if grep -q "^REGA_URG:" /tmp/acoes.txt 2>/dev/null; then
              MESSAGE="${MESSAGE}URGENTE - Rega Atrasada:%0A"
              while IFS=: read -r tipo texto; do
                [ "$tipo" = "REGA_URG" ] && MESSAGE="${MESSAGE}• ${texto}%0A"
              done < /tmp/acoes.txt
              MESSAGE="${MESSAGE}%0A"
            fi
            
            # Adicionar rega normal
            if grep -q "^REGA_NORM:" /tmp/acoes.txt 2>/dev/null; then
              MESSAGE="${MESSAGE}Rega:%0A"
              while IFS=: read -r tipo texto; do
                [ "$tipo" = "REGA_NORM" ] && MESSAGE="${MESSAGE}• ${texto}%0A"
              done < /tmp/acoes.txt
              MESSAGE="${MESSAGE}%0A"
            fi
            
            # Adicionar poda
            if grep -q "^PODA:" /tmp/acoes.txt 2>/dev/null; then
              MESSAGE="${MESSAGE}Poda:%0A"
              while IFS=: read -r tipo texto; do
                [ "$tipo" = "PODA" ] && MESSAGE="${MESSAGE}• ${texto}%0A"
              done < /tmp/acoes.txt
              MESSAGE="${MESSAGE}%0A"
            fi
            
            # Adicionar colheita
            if grep -q "^COLHEITA:" /tmp/acoes.txt 2>/dev/null; then
              MESSAGE="${MESSAGE}Colheita:%0A"
              while IFS=: read -r tipo texto; do
                [ "$tipo" = "COLHEITA" ] && MESSAGE="${MESSAGE}• ${texto}%0A"
              done < /tmp/acoes.txt
              MESSAGE="${MESSAGE}%0A"
            fi
            
            MESSAGE="${MESSAGE}----%0A"
            MESSAGE="${MESSAGE}Acesse o app para marcar como concluído"
          fi
          
          # Limpar arquivo temporário
          rm -f /tmp/acoes.txt
          
          # Enviar notificação
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="${MESSAGE}" \
            -d parse_mode="Markdown"
          
          echo "Notificação enviada com sucesso!"
          
      - name: Resumo estatístico (apenas 06h)
        if: github.event.schedule == '0 9 * * *'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Estatísticas gerais
          TOTAL=$(jq '.features | length' dados.geojson)
          COQUEIROS=$(jq '[.features[] | select(.properties.NOME_POPULAR == "Coqueiro")] | length' dados.geojson)
          CAJUEIROS=$(jq '[.features[] | select(.properties.NOME_POPULAR == "Cajueiro")] | length' dados.geojson)
          CACAU=$(jq '[.features[] | select(.properties.NOME_POPULAR == "Cacau")] | length' dados.geojson)
          MANGABEIRA=$(jq '[.features[] | select(.properties.NOME_POPULAR == "Mangabeira")] | length' dados.geojson)
          
          STATS="Resumo do Sítio:%0A"
          STATS="${STATS}• Total: ${TOTAL} plantas%0A"
          [ "$COQUEIROS" -gt 0 ] && STATS="${STATS}• Coqueiros: ${COQUEIROS}%0A"
          [ "$CAJUEIROS" -gt 0 ] && STATS="${STATS}• Cajueiros: ${CAJUEIROS}%0A"
          [ "$CACAU" -gt 0 ] && STATS="${STATS}• Cacau: ${CACAU}%0A"
          [ "$MANGABEIRA" -gt 0 ] && STATS="${STATS}• Mangabeira: ${MANGABEIRA}%0A"
          
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="${STATS}"
