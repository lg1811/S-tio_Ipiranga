name: notify-telegram

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *" # Executa todo dia às 12h UTC (9h no Brasil)

jobs:
  notify-telegram:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Processar dados e enviar notificação
        run: |
          DATA=$(date +"%d/%m/%Y %H:%M")

          TOTAL=$(jq '.features | length' dados.geojson)
          COQUEIROS=$(jq '[.features[] | select(.properties.NOME_POPULAR == "Coqueiro")] | length' dados.geojson)
          CAJUEIROS=$(jq '[.features[] | select(.properties.NOME_POPULAR == "Cajueiro")] | length' dados.geojson)
          CACAUEIROS=$(jq '[.features[] | select(.properties.NOME_POPULAR == "Cacaueiro")] | length' dados.geojson)
          MANGABEIRAS=$(jq '[.features[] | select(.properties.NOME_POPULAR == "Mangabeira")] | length' dados.geojson)

          # Listar árvores que precisam de irrigação
          LISTA_IRRIGACAO=$(jq -r '[.features[] 
              | select(.properties.IRRIGACAO_ORDINARIA != null and .properties.DATA_IRRIGACAO_ORDINARIA == null) 
              | .properties.NOME_POPULAR] 
              | join(", ")' dados.geojson)

          # Listar árvores com poda programada
          LISTA_PODA=$(jq -r '[.features[] 
              | select(.properties.DATA_PODA_FORMACAO_1 != null or .properties.DATA_PODA_FORMACAO_2 != null or .properties.DATA_PODA_FORMACAO_3 != null) 
              | .properties.NOME_POPULAR] 
              | join(", ")' dados.geojson)

          # Definir limite de 30 dias para plantios recentes
          DATA_LIMITE=$(date -d "30 days ago" +"%Y-%m-%d")

          LISTA_PLANTIOS=$(jq -r --arg date "$DATA_LIMITE" '[.features[] 
              | select(.properties.DATA_PLANTIO != null and .properties.DATA_PLANTIO > $date) 
              | "\(.properties.NOME_POPULAR) (\(.properties.DATA_PLANTIO))"] 
              | join(", ")' dados.geojson)

          # Montar mensagem
          MESSAGE="🌳 *Relatório Diário - Árvores Frutíferas*%0A%0A"
          MESSAGE="${MESSAGE}📊 *Resumo Geral:*%0A• Total de árvores: ${TOTAL}%0A• 🥥 Coqueiros: ${COQUEIROS}%0A• 🥜 Cajueiros: ${CAJUEIROS}%0A• 🍫 Cacaueiros: ${CACAUEIROS}%0A• 🍈 Mangabeiras: ${MANGABEIRAS}%0A%0A"

          if [ "$LISTA_IRRIGACAO" != "" ]; then
            MESSAGE="${MESSAGE}💧 *Precisam de irrigação:* ${LISTA_IRRIGACAO}%0A%0A"
          fi

          if [ "$LISTA_PODA" != "" ]; then
            MESSAGE="${MESSAGE}✂️ *Com poda programada:* ${LISTA_PODA}%0A%0A"
          fi

          if [ "$LISTA_PLANTIOS" != "" ]; then
            MESSAGE="${MESSAGE}🌱 *Plantios recentes:* ${LISTA_PLANTIOS}%0A%0A"
          fi

          MESSAGE="${MESSAGE}📅 Data: ${DATA}%0A🔄 Atualização automática via GitHub Actions"

          # Enviar para Telegram
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
          -d chat_id=${{ secrets.CHAT_ID }} \
          -d text="$MESSAGE" \
          -d parse_mode="Markdown"
